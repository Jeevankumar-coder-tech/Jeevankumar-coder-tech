<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" width="100%" height="140" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="50%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#6366F1;#38BDF8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#6366F1">
        <animate attributeName="stop-color" values="#6366F1;#38BDF8;#6366F1" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#6366F1;#38BDF8" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Left & Right Fade Masks for Smooth Marquee -->
    <linearGradient id="fadeMaskLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="1" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="fadeMaskRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="1" />
    </linearGradient>

    <style>
      .track {
        display: flex;
        animation: marquee 22s linear infinite;
      }
      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-700px); }
      }
      .badge-card {
        transition: transform 0.3s ease;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #F0F6FC;
      }
      .category-pill {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        fill: #38BDF8;
      }
      .pulse-dot {
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; r: 3; }
        50% { opacity: 1; r: 4.5; }
      }
    </style>
  </defs>

  <!-- Container Box with Rounded Chamfer & Glowing Border -->
  <rect x="2" y="2" width="846" height="136" rx="14" fill="url(#bgGrad)" stroke="url(#borderGlow)" stroke-width="1.5" />

  <!-- Top Status / Subtitle Bar inside Card -->
  <circle cx="28" cy="24" r="3.5" fill="#38BDF8" class="pulse-dot" />
  <text x="40" y="28" class="category-pill">Active Toolbelt &amp; Core Architecture</text>
  <text x="822" y="27" text-anchor="end" font-family="monospace" font-size="10" fill="#6E7681">PRODUCTION STACK</text>
  <line x1="20" y1="38" x2="830" y2="38" stroke="#30363D" stroke-width="0.8" stroke-dasharray="3,3" />

  <!-- Marquee Group (Infinite Looping Track) -->
  <g clip-path="url(#cardClip)">
    <clipPath id="cardClip">
      <rect x="4" y="44" width="842" height="88" rx="10" />
    </clipPath>

    <g class="track">
      <!-- SET 1 (700px wide) -->
      <!-- Python -->
      <g transform="translate(20, 52)" class="badge-card">
        <rect width="110" height="42" rx="10" fill="#1F2937" stroke="#3776AB" stroke-width="1.2" />
        <circle cx="22" cy="21" r="10" fill="#3776AB" />
        <text x="22" y="25" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="11" fill="#FFD43B">Py</text>
        <text x="40" y="26" class="badge-text">Python</text>
      </g>

      <!-- React -->
      <g transform="translate(140, 52)" class="badge-card">
        <rect width="110" height="42" rx="10" fill="#1F2937" stroke="#61DAFB" stroke-width="1.2" />
        <circle cx="22" cy="21" r="10" fill="#20232A" />
        <circle cx="22" cy="21" r="3" fill="#61DAFB" />
        <ellipse cx="22" cy="21" rx="8" ry="3" fill="none" stroke="#61DAFB" stroke-width="1" />
        <text x="40" y="26" class="badge-text">React.js</text>
      </g>

      <!-- AWS -->
      <g transform="translate(260, 52)" class="badge-card">
        <rect width="105" height="42" rx="10" fill="#1F2937" stroke="#FF9900" stroke-width="1.2" />
        <circle cx="22" cy="21" r="10" fill="#232F3E" />
        <text x="22" y="25" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="9" fill="#FF9900">AWS</text>
        <text x="40" y="26" class="badge-text">AWS</text>
      </g>

      <!-- Gen AI -->
      <g transform="translate(375, 52)" class="badge-card">
        <rect width="125" height="42" rx="10" fill="#1F2937" stroke="#8B5CF6" stroke-width="1.2" />
        <circle cx="22" cy="21" r="10" fill="#6D28D9" />
        <text x="22" y="25" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="9" fill="#FFFFFF">AI</text>
        <text x="40" y="26" class="badge-text">Generative AI</text>
      </g>

      <!-- JavaScript -->
      <g transform="translate(510, 52)" class="badge-card">
        <rect width="120" height="42" rx="10" fill="#1F2937" stroke="#F7DF1E" stroke-width="1.2" />
        <rect x="12" y="11" width="20" height="20" rx="4" fill="#F7DF1E" />
        <text x="22" y="25" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="11" fill="#000000">JS</text>
        <text x="40" y="26" class="badge-text">JavaScript</text>
      </g>

      <!-- MySQL -->
      <g transform="translate(640, 52)" class="badge-card">
        <rect width="110" height="42" rx="10" fill="#1F2937" stroke="#00758F" stroke-width="1.2" />
        <circle cx="22" cy="21" r="10" fill="#00758F" />
        <text x="22" y="25" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="8" fill="#F29111">SQL</text>
        <text x="40" y="26" class="badge-text">MySQL</text>
      </g>

      <!-- SET 2 (Duplicate for Seamless Loop at 700px offset) -->
      <!-- Python -->
      <g transform="translate(770, 52)" class="badge-card">
        <rect width="110" height="42" rx="10" fill="#1F2937" stroke="#3776AB" stroke-width="1.2" />
        <circle cx="22" cy="21" r="10" fill="#3776AB" />
        <text x="22" y="25" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="11" fill="#FFD43B">Py</text>
        <text x="40" y="26" class="badge-text">Python</text>
      </g>

      <!-- React -->
      <g transform="translate(890, 52)" class="badge-card">
        <rect width="110" height="42" rx="10" fill="#1F2937" stroke="#61DAFB" stroke-width="1.2" />
        <circle cx="22" cy="21" r="10" fill="#20232A" />
        <circle cx="22" cy="21" r="3" fill="#61DAFB" />
        <ellipse cx="22" cy="21" rx="8" ry="3" fill="none" stroke="#61DAFB" stroke-width="1" />
        <text x="40" y="26" class="badge-text">React.js</text>
      </g>

      <!-- AWS -->
      <g transform="translate(1010, 52)" class="badge-card">
        <rect width="105" height="42" rx="10" fill="#1F2937" stroke="#FF9900" stroke-width="1.2" />
        <circle cx="22" cy="21" r="10" fill="#232F3E" />
        <text x="22" y="25" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="9" fill="#FF9900">AWS</text>
        <text x="40" y="26" class="badge-text">AWS</text>
      </g>

      <!-- Gen AI -->
      <g transform="translate(1125, 52)" class="badge-card">
        <rect width="125" height="42" rx="10" fill="#1F2937" stroke="#8B5CF6" stroke-width="1.2" />
        <circle cx="22" cy="21" r="10" fill="#6D28D9" />
        <text x="22" y="25" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="9" fill="#FFFFFF">AI</text>
        <text x="40" y="26" class="badge-text">Generative AI</text>
      </g>

      <!-- JavaScript -->
      <g transform="translate(1260, 52)" class="badge-card">
        <rect width="120" height="42" rx="10" fill="#1F2937" stroke="#F7DF1E" stroke-width="1.2" />
        <rect x="12" y="11" width="20" height="20" rx="4" fill="#F7DF1E" />
        <text x="22" y="25" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="11" fill="#000000">JS</text>
        <text x="40" y="26" class="badge-text">JavaScript</text>
      </g>

      <!-- MySQL -->
      <g transform="translate(1390, 52)" class="badge-card">
        <rect width="110" height="42" rx="10" fill="#1F2937" stroke="#00758F" stroke-width="1.2" />
        <circle cx="22" cy="21" r="10" fill="#00758F" />
        <text x="22" y="25" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="8" fill="#F29111">SQL</text>
        <text x="40" y="26" class="badge-text">MySQL</text>
      </g>
    </g>
  </g>

  <!-- Left & Right Smooth Edge Fade Overlays -->
  <rect x="3" y="44" width="70" height="88" fill="url(#fadeMaskLeft)" pointer-events="none" />
  <rect x="777" y="44" width="70" height="88" fill="url(#fadeMaskRight)" pointer-events="none" />
</svg>
